categories:
- id: web-frameworks
  title: Web frameworks
  blurb: Frameworks and toolkits to build web apps and APIs.
- id: asgi-servers
  title: ASGI servers
  blurb: Servers that run asyncio web applications.
- id: http-clients
  title: HTTP clients
  blurb: Async HTTP clients and request helpers.
- id: websockets-realtime
  title: WebSockets and realtime
  blurb: WebSocket, SSE and pub/sub libraries.
- id: graphql
  title: GraphQL
  blurb: Libraries to build and query GraphQL APIs.
- id: rpc
  title: RPC and serialization
  blurb: gRPC, JSON-RPC and other remote call libraries.
- id: message-queues
  title: Message queues and brokers
  blurb: Clients for AMQP, Kafka, NATS, ZeroMQ, MQTT and others.
- id: task-queues
  title: Task queues and schedulers
  blurb: Background jobs, workers and cron-style scheduling.
- id: database-drivers
  title: Database drivers
  blurb: Async drivers for SQL, NoSQL, search and time-series databases.
- id: orm
  title: ORMs and query builders
  blurb: Object mappers and query builders on top of async drivers.
- id: networking
  title: Networking
  blurb: DNS, SSH, ping, sockets and protocol implementations.
- id: cloud-devops
  title: Cloud and DevOps
  blurb: SDKs and clients for cloud providers, Kubernetes and Docker.
- id: files-io
  title: Files and I/O
  blurb: Async file access, subprocesses, serial ports and streams.
- id: concurrency
  title: Concurrency utilities
  blurb: Primitives, rate limiters, pools, timeouts and runners.
- id: event-loops
  title: Event loops
  blurb: Alternative event loop implementations.
- id: testing
  title: Testing
  blurb: Test runners, mocks and fixtures for async code.
- id: observability
  title: Observability and debugging
  blurb: Tracing, metrics, profiling and debugging tools.
- id: scraping-automation
  title: Scraping and browser automation
  blurb: Crawlers and headless browser drivers.
- id: bots-chat
  title: Bots and chat
  blurb: Client libraries for chat platforms and bot frameworks.
- id: auth-security
  title: Auth and security
  blurb: Authentication, authorization and crypto helpers.
- id: cli-tui
  title: CLI and TUI
  blurb: Command line and terminal UI libraries with async support.
- id: iot-hardware
  title: IoT and hardware
  blurb: Home automation, devices and embedded protocols.
- id: alternatives
  title: Alternatives to asyncio
  blurb: Other async runtimes and compatibility layers.
- id: caching
  title: Caching
  blurb: Cache managers and memoization for async code.
- id: email
  title: Email
  blurb: Send and receive email without blocking.
- id: dev-tools
  title: Development tools
  blurb: Reloaders, file watchers and notebook helpers.
- id: helpers
  title: Async helpers
  blurb: Small building blocks for everyday async code.
- id: events-workflows
  title: Events and workflows
  blurb: Signals, dataflow graphs and pipelines.
- id: ai
  title: AI and LLM
  blurb: Async clients and tooling for AI workloads.
- id: misc
  title: Misc
  blurb: Everything else.
